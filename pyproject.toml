[project]
name = "supplyrisk"
version = "0.1.0"
description = "Can an untrained decision model forecast low-water events on the Rio Negro at Manaus? An evaluation of Jev against traditional forecasting methods."
authors = [
    { name = "Douglas", email = "douglas.sm747@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "typesafe-sdk>=0.7.2",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
